<svg xmlns="http://www.w3.org/2000/svg" width="300" height="40" viewBox="0 0 300 40" role="img" aria-label="Disponible pour un stage de 4 à 5 semaines">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="300" height="40" rx="20" fill="url(#g)"/>
  <circle cx="24" cy="20" r="4" fill="#FFFFFF"/>
  <circle cx="24" cy="20" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <animate attributeName="r" values="4;10" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="25" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" textLength="240" lengthAdjust="spacingAndGlyphs">Disponible · stage de 4 à 5 semaines</text>
</svg>
